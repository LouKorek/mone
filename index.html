<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#0f141d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="מונה">
<title>מונה</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-64.png" sizes="64x64" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@900&family=Heebo:wght@400;500;700&family=IBM+Plex+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" crossorigin="">
<link rel="stylesheet" href="src/styles.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-phone" viewBox="0 0 24 24"><path d="M6 3h4l2 5-2.5 1.5a11 11 0 0 0 5 5L16 12l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 4 5a2 2 0 0 1 2-2z"/></symbol>
  <symbol id="i-plane" viewBox="0 0 24 24"><path d="M2 14l8-2 4-8h3l-2 8 6 2v2l-6 0-2 6h-2l-1-6-5 1z"/></symbol>
  <symbol id="i-road" viewBox="0 0 24 24"><path d="M4 21L9 3h2l-1 18zm9 0L14 3h2l4 18zM11.3 6h1.4l.2 3h-1.8zm-.4 6h2.2l.3 4h-2.8z"/></symbol>
  <symbol id="i-tunnel" viewBox="0 0 24 24"><path d="M3 21V12a9 9 0 0 1 18 0v9h-4v-9a5 5 0 0 0-10 0v9z"/></symbol>
  <symbol id="i-bolt" viewBox="0 0 24 24"><path d="M13 2L4 14h6l-1 8 9-12h-6z"/></symbol>
  <symbol id="i-palm" viewBox="0 0 24 24"><path d="M11 22V10l-4 3-1-1 4-4-6-1 1-2 6 1-3-5 2-1 3 5 3-5 2 1-3 5 6-1 1 2-6 1 4 4-1 1-4-3v12z"/></symbol>
  <symbol id="i-clock" viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm0 18a8 8 0 1 1 0-16 8 8 0 0 1 0 16zm1-13h-2v6l5 3 1-1.7-4-2.3z"/></symbol>
  <symbol id="i-info" viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm1 15h-2v-6h2zm0-8h-2V7h2z"/></symbol>
  <symbol id="i-calc" viewBox="0 0 24 24"><path d="M6 2h12a2 2 0 0 1 2 2v16a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2zm1 3v4h10V5zm0 6v2h3v-2zm0 4v2h3v-2zm5-4v2h3v-2zm0 4v2h3v-2z"/></symbol>
  <symbol id="i-meter" viewBox="0 0 24 24"><path d="M12 3a9 9 0 0 0-9 9v1h4l-1-1a6 6 0 1 1 12 0l-1 1h4v-1a9 9 0 0 0-9-9zm-1 9l4-5 1 1-3 5a1.5 1.5 0 1 1-2-1zM5 15h14v2H5z"/></symbol>
  <symbol id="i-list" viewBox="0 0 24 24"><path d="M4 5h16v2H4zm0 6h16v2H4zm0 6h10v2H4z"/></symbol>
  <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></symbol>
  <symbol id="i-download" viewBox="0 0 24 24"><path d="M11 3h2v9.2l3-3 1.4 1.4L12 16l-5.4-5.4L8 9.2l3 3zM4 18h16v2H4z"/></symbol>
  <symbol id="i-chev" viewBox="0 0 24 24"><path d="M15 4l-8 8 8 8 1.5-1.5L10 12l6.5-6.5z"/></symbol>
</svg>

<div id="app">
  <header class="topbar">
    <img src="icons/logo-96.png" alt="" width="34" height="34">
    <h1>מונה</h1>
    <span class="sub" id="topSub">מחשבון</span>
  </header>

  <main>
    <!-- ================= מחשבון ================= -->
    <section class="view" id="view-calc">
      <div class="row2">
        <label class="field"><span>ק"מ</span><input id="km" type="number" inputmode="decimal" min="0" step="0.1" placeholder="0.0"></label>
        <label class="field"><span>דקות</span><input id="minutes" type="number" inputmode="numeric" min="0" step="1" placeholder="0"></label>
      </div>
      <div class="field when">
        <span>מתי</span>
        <input id="when" type="datetime-local" aria-label="תאריך ושעת הנסיעה">
        <button class="mini" id="nowBtn" type="button">עכשיו</button>
        <b class="badge" id="calcTariff">א'</b>
      </div>
      <div class="tiles" id="calcTiles" role="group" aria-label="תוספות"></div>
      <button class="price" id="calcPrice" type="button" aria-label="פתח פירוט">
        <span class="big" id="calcTotal">₪ 12.46</span>
        <span class="sub" id="calcSub">הזן מרחק או דקות</span>
      </button>
      <label class="field asked"><span>הנהג ביקש</span><input id="asked" type="number" inputmode="decimal" min="0" step="1" placeholder="₪"></label>
      <div class="diff" id="calcDiff" hidden></div>
    </section>

    <!-- ================= מונה חי ================= -->
    <section class="view" id="view-live" hidden>
      <div class="price live" id="livePrice">
        <span class="big" id="meterTotal">₪ 12.46</span>
        <span class="sub" id="meterSub">מוכן לנסיעה</span>
        <span class="stats"><b id="meterKm">0.00</b> ק"מ · <b id="meterTime">00:00</b> · <b id="meterSpeed">—</b> קמ"ש</span>
      </div>
      <div class="map" id="map"><div class="map-empty" id="mapEmpty">המפה תופיע כאן בזמן הנסיעה</div><div class="gps" id="meterGps">GPS כבוי</div><button class="recenter" id="recenter" type="button" aria-label="חזור למיקום" hidden>◎</button></div>
      <div class="tiles compact" id="liveTiles" role="group" aria-label="תוספות לנסיעה"></div>
      <button class="btn" id="liveStart" type="button">התחל נסיעה</button>
      <button class="btn warn" id="liveStop" type="button" hidden>סיים נסיעה</button>
    </section>

    <!-- ================= נסיעות ================= -->
    <section class="view" id="view-rides" hidden>
      <div class="list" id="ridesList"></div>
      <p class="empty" id="ridesEmpty">עדיין אין נסיעות שמורות. נסיעות מהמונה החי נשמרות כאן אוטומטית.</p>
    </section>

    <!-- ================= עוד ================= -->
    <section class="view" id="view-more" hidden>
      <div class="list menu">
        <button type="button" data-sheet="account" class="account"><img id="accountImg" src="icons/logo-96.png" alt="" width="28" height="28" referrerpolicy="no-referrer"><span><b id="accountLabel">התחברות</b><small id="accountSub">שמור נסיעות בענן וגש אליהן מכל מכשיר</small></span><svg class="chev"><use href="#i-chev"/></svg></button>
        <button type="button" id="installRow" hidden><svg><use href="#i-download"/></svg><span>התקן את מונה במסך הבית</span><svg class="chev"><use href="#i-chev"/></svg></button>
        <button type="button" data-sheet="tariffs"><svg><use href="#i-list"/></svg><span>התעריפים הנוכחיים</span><svg class="chev"><use href="#i-chev"/></svg></button>
        <button type="button" data-sheet="rights"><svg><use href="#i-info"/></svg><span>ידעת? זכויות הנוסע</span><svg class="chev"><use href="#i-chev"/></svg></button>
        <button type="button" data-sheet="complaint"><svg><use href="#i-phone"/></svg><span>הגשת תלונה על נהג</span><svg class="chev"><use href="#i-chev"/></svg></button>
        <button type="button" data-sheet="about"><svg><use href="#i-meter"/></svg><span>אודות ומקורות</span><svg class="chev"><use href="#i-chev"/></svg></button>
      </div>
      <div class="legal-links"><button type="button" data-sheet="terms">תנאי שימוש</button><span>·</span><button type="button" data-sheet="privacy">מדיניות פרטיות</button><span>·</span><button type="button" data-sheet="accessibility">הצהרת נגישות</button></div>
    </section>
  </main>

  <nav class="tabbar" role="tablist">
    <button role="tab" aria-selected="true" data-view="calc"><svg><use href="#i-calc"/></svg>מחשבון</button>
    <button role="tab" aria-selected="false" data-view="live"><svg><use href="#i-meter"/></svg>מונה חי</button>
    <button role="tab" aria-selected="false" data-view="rides"><svg><use href="#i-list"/></svg>נסיעות</button>
    <button role="tab" aria-selected="false" data-view="more"><svg><use href="#i-more"/></svg>עוד</button>
  </nav>
</div>

<!-- גיליון תחתון -->
<div class="sheet-backdrop" id="sheetBackdrop" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden>
  <div class="grip"></div>
  <div class="sheet-head"><h2 id="sheetTitle"></h2><button class="close" id="sheetClose" type="button" aria-label="סגור">✕</button></div>
  <div class="sheet-body" id="sheetBody"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js" crossorigin=""></script>
<script type="module" src="src/app.js"></script>
</body>
</html>
