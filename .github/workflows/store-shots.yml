# צילומי מסך לחנויות מהאפליקציה האמיתית (tools/store-shots.mjs). הפעלה ידנית; התוצר: ארטיפקט store-shots
# עם play/ (1080x1920, ל-Google Play) ו-ios/<גודל>/ (ל-App Store; ios-submit.yml מעלה אותם בעצמו עם screenshots=yes).
name: Store screenshots

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Screenshots
        run: |
          npm install --no-audit --no-fund
          npm install --no-save --no-audit --no-fund playwright@1.48.2
          npx playwright install --with-deps chromium
          node build.mjs
          node tools/store-shots.mjs out/store-shots
        env:
          TZ: Asia/Jerusalem
      - uses: actions/upload-artifact@v4
        with:
          name: store-shots
          path: out/store-shots
      # עותק בענף נפרד (store-shots-<מספר הרצה>) כדי שאפשר יהיה לעבור על הצילומים גם בלי להוריד ארטיפקט
      - name: Publish to a screenshots branch
        run: |
          cd out/store-shots
          git init -q -b shots
          git add -A
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -q -m "store screenshots ${{ github.sha }}"
          git push "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" shots:store-shots-${{ github.run_number }}
